<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Million Message Wall</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1e1e2a;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #6b6b80;
      --border: rgba(255,255,255,0.07);
      --tile-size: min(9vw, 120px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ── NAV ── */
    #nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      gap: 16px;
    }

    #nav-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    #wall-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 1;
      justify-content: center;
    }
    #wall-tabs::-webkit-scrollbar { display: none; }

    .wall-tab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    .wall-tab:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .wall-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    #nav-cta {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 20px;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      white-space: nowrap;
    }
    #nav-cta:hover {
      background: var(--accent);
      color: #fff;
    }

    /* ── MAIN ── */
    #main {
      position: fixed;
      top: 64px; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }

    #wall-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #wall-label {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s, transform 0.4s;
    }
    #wall-label.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, var(--tile-size));
      grid-template-rows: repeat(10, calc(var(--tile-size) * 9 / 16));
      gap: 4px;
    }

    /* ── TILE ── */
    .tile {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface2);
      border: 1px solid var(--border);
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .tile:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 32px rgba(124,106,247,0.35);
      z-index: 2;
      border-color: var(--accent);
    }
    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tile-empty {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--muted);
    }

    /* tile number badge */
    .tile-num {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0,0,0,0.65);
      color: rgba(255,255,255,0.7);
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      pointer-events: none;
    }

    /* hover message overlay */
    .tile-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,15,0.92) 0%, rgba(10,10,15,0.4) 60%, transparent 100%);
      display: flex;
      align-items: flex-end;
      padding: 6px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .tile:hover .tile-overlay { opacity: 1; }
    .tile-overlay-text {
      font-size: 10px;
      line-height: 1.3;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── MODAL ── */
    #modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    #modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      overflow: hidden;
      transform: translateY(16px) scale(0.97);
      transition: transform 0.25s;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }
    #modal-backdrop.open #modal {
      transform: translateY(0) scale(1);
    }

    #modal-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: var(--surface2);
    }

    #modal-body {
      padding: 20px 24px 24px;
    }

    #modal-meta {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 8px;
    }

    #modal-message {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 20px;
    }

    #modal-actions {
      display: flex;
      gap: 10px;
    }

    #modal-yt {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      background: #ff0000;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      transition: opacity 0.2s;
    }
    #modal-yt:hover { opacity: 0.85; }
    #modal-yt.hidden { display: none; }

    #modal-close {
      padding: 10px 16px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    #modal-close:hover { background: #2a2a3a; }

    /* ── LOADING ── */
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--muted);
      gap: 10px;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      :root { --tile-size: min(18vw, 80px); }
      #nav-title { display: none; }
      #nav-cta { display: none; }
      #wall-tabs { justify-content: flex-start; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <span id="nav-title">✦ Million Message Wall</span>
    <div id="wall-tabs"></div>
    <a id="nav-cta" href="https://igg.me/at/IouGgXu7tdU/x/38646669#/" target="_blank">Contribute</a>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <div id="wall-wrap">
      <div id="wall-label"></div>
      <div id="grid">
        <div id="loading"><div class="spinner"></div> Loading wall…</div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-backdrop">
    <div id="modal">
      <img id="modal-thumb" src="" alt="Video thumbnail" />
      <div id="modal-body">
        <div id="modal-meta"></div>
        <div id="modal-message"></div>
        <div id="modal-actions">
          <a id="modal-yt" href="#" target="_blank">▶ Watch on YouTube</a>
          <button id="modal-close">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const COLS = 10;
    const ROWS = 10;
    const TOTAL = COLS * ROWS;

    const wallNames = {
      1: "EDM",
      2: "Education",
      3: "Classical Music",
      4: "Books",
      5: "Art",
      6: "Crossfit"
    };

    const wallIds = Object.keys(wallNames).map(Number);

    let currentWall = 1;
    let sampleVideos = [];
    let messages = [];

    // ── Build wall tabs ──
    const tabsEl = document.getElementById('wall-tabs');
    wallIds.forEach(id => {
      const btn = document.createElement('button');
      btn.className = 'wall-tab' + (id === currentWall ? ' active' : '');
      btn.textContent = `${wallNames[id]}`;
      btn.dataset.wall = id;
      btn.addEventListener('click', () => loadWall(id));
      tabsEl.appendChild(btn);
    });

    // ── Load wall data ──
    function loadWall(wallId) {
      currentWall = wallId;

      // update tabs
      document.querySelectorAll('.wall-tab').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.wall) === wallId);
      });

      // update label
      const label = document.getElementById('wall-label');
      label.textContent = `Wall ${wallId}: ${wallNames[wallId]}`;
      label.classList.remove('visible');
      requestAnimationFrame(() => requestAnimationFrame(() => label.classList.add('visible')));

      // show loading
      const grid = document.getElementById('grid');
      grid.innerHTML = '<div id="loading"><div class="spinner"></div> Loading wall…</div>';

      const pad = wallId.toString().padStart(4, '0');
      const videoFile = `https://mmw-art.github.io/website/videos-${pad}.txt`;
      const messageFile = `https://mmw-art.github.io/website/messages-${pad}.txt`;

      Promise.all([
        fetch(videoFile).then(r => r.text()).catch(() => ''),
        fetch(messageFile).then(r => r.text()).catch(() => '')
      ]).then(([videoText, messageText]) => {
        sampleVideos = videoText.trim().split('\n').map(l => l.trim()).filter(Boolean);
        messages = messageText.trim().split('\n').map(l => l.trim()).filter(Boolean);
        renderGrid();
      });
    }

    // ── Render 10×10 grid ──
    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      for (let i = 0; i < TOTAL; i++) {
        const youtubeId = sampleVideos[i] || '';
        const message = messages[i] || '';

        const tile = document.createElement('div');
        tile.className = 'tile';

        if (youtubeId) {
          const img = document.createElement('img');
          img.src = `https://img.youtube.com/vi/${youtubeId}/mqdefault.jpg`;
          img.alt = `Tile ${i + 1}`;
          img.loading = 'lazy';
          tile.appendChild(img);
        } else {
          const empty = document.createElement('div');
          empty.className = 'tile-empty';
          empty.textContent = '✦';
          tile.appendChild(empty);
        }

        // number badge
        const num = document.createElement('div');
        num.className = 'tile-num';
        num.textContent = i + 1;
        tile.appendChild(num);

        // hover overlay with message preview
        if (message) {
          const overlay = document.createElement('div');
          overlay.className = 'tile-overlay';
          const txt = document.createElement('div');
          txt.className = 'tile-overlay-text';
          txt.textContent = message;
          overlay.appendChild(txt);
          tile.appendChild(overlay);
        }

        tile.addEventListener('click', () => openModal(i, youtubeId, message));
        grid.appendChild(tile);
      }
    }

    // ── Modal ──
    const backdrop = document.getElementById('modal-backdrop');
    const modalThumb = document.getElementById('modal-thumb');
    const modalMeta = document.getElementById('modal-meta');
    const modalMessage = document.getElementById('modal-message');
    const modalYt = document.getElementById('modal-yt');
    const modalClose = document.getElementById('modal-close');

    function openModal(index, youtubeId, message) {
      const wallName = wallNames[currentWall] || '';
      modalMeta.textContent = `Wall ${currentWall}: ${wallName}  ·  Message #${index + 1}`;
      modalMessage.textContent = message || 'No message yet.';

      if (youtubeId) {
        modalThumb.src = `https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;
        modalThumb.style.display = 'block';
        modalYt.href = `https://www.youtube.com/watch?v=${youtubeId}`;
        modalYt.classList.remove('hidden');
      } else {
        modalThumb.style.display = 'none';
        modalYt.classList.add('hidden');
      }

      backdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      backdrop.classList.remove('open');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // ── Init ──
    loadWall(1);
  </script>
</body>
</html>
